# 把纯静态站点发布到 GitHub Pages。
#
# 这里刻意用 `pnpm build:nodeps`（零依赖构建脚本）而不是 Vite：
# 项目的目标就是"没有运行时依赖的静态站点"，这个脚本在任何 Node 22.13+ 环境都能跑，
# 也避免了 esbuild 在受限环境里 spawn 子进程失败的问题。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑核心逻辑测试
        run: node --experimental-strip-types tests/core.test.ts
      - name: 中文标点检查
        run: node scripts/check-punctuation.mjs
      - name: 构建静态站点（零依赖）
        run: node scripts/build.mjs
      - name: 冒烟测试（最小 DOM 桩，真跑一遍构建产物）
        run: node tests/dom-smoke.mjs dist
      - name: 产物自检（防止再发出白屏站点）
        run: node scripts/verify-dist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
