# 把纯静态站点发布到 GitHub Pages。
#
# 这里刻意用零依赖构建脚本而不是 Vite：项目的目标就是"没有运行时依赖的静态站点"，
# 这个脚本在任何 Node 22.13+ 环境都能跑，也避免了 esbuild 在受限环境里 spawn 子进程失败。
#
# 只跑零依赖、秒级的检查。真实浏览器的检查（截图、离线渲染波形）留在本地按需跑：
# 它们要冷启一台 Chrome，一分钟里五十秒都花在那儿，不值得卡住每次发布。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 测试与构建
        run: |
          node --experimental-strip-types tests/engine.test.ts
          node --experimental-strip-types tests/core.test.ts
          node --experimental-strip-types tests/audio.test.ts
          node scripts/check-punctuation.mjs
          node scripts/build.mjs
          node tests/dom-smoke.mjs dist
          node scripts/verify-dist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
